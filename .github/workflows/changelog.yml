name: Change log

# Every pull request must add an entry to CHANGELOG.md, unless it carries the
# `no-changelog` label (for changes with no visible effect).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: CHANGELOG.md updated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that CHANGELOG.md changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "::error file=CHANGELOG.md::Add an entry to CHANGELOG.md under today's date, or add the no-changelog label if this change has no visible effect."
            exit 1
          fi
