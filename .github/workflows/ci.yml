name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  database:
    name: RLS and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SP_HOSTNAME: example.sharepoint.com
      - run: npm run test:e2e

  e2e-full:
    name: Full end-to-end (Supabase Auth + PostgREST + Graph stand-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase (Postgres, Auth, PostgREST, test inbox; applies migrations)
        run: supabase start
      - name: Pass the local Supabase URL and keys to the next steps
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          anon="${ANON_KEY:-$PUBLISHABLE_KEY}"
          service="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          echo "::add-mask::$anon"
          echo "::add-mask::$service"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "SUPABASE_MAIL_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          } >> "$GITHUB_ENV"
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:e2e:full
      - name: Supabase Auth log (on failure)
        if: failure()
        run: docker logs --tail 200 supabase_auth_quail-hollow-portal || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-full
          path: playwright-report-full
          retention-days: 7
