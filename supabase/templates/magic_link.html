<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f7f5f0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#1c1c1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;">
            <tr>
              <td style="background:#1f4d3a;color:#ffffff;padding:18px 24px;font-size:16px;font-weight:600;border-radius:12px 12px 0 0;">
                Quail Hollow Accounting Services
              </td>
            </tr>
            <tr>
              <td style="padding:24px;font-size:16px;line-height:1.5;">
                <p>Here is your one-time sign-in code for the Quail Hollow secure client portal:</p>
                <p style="font-size:32px;font-weight:700;letter-spacing:8px;font-family:Menlo,Consolas,monospace;margin:24px 0;">{{ .Token }}</p>
                <p>The code expires in 10 minutes. If you did not try to sign in, you can ignore this email.</p>
                <p style="font-size:13px;color:#555;">Questions? Call our office at 352-723-5062.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
