# Supabase CLI configuration for local development (`supabase start`).
# Production settings are applied in the Supabase dashboard; see docs/supabase-setup.md.
project_id = "quail-hollow-portal"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
# Files never live in Supabase. They go straight to SharePoint.
enabled = false

# Local test inbox: sign-in codes sent by local Auth land here (used by the full E2E run).
[inbucket]
enabled = true
port = 54324

# Not used by the portal; off to keep `supabase start` small.
[studio]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
# Short-lived access tokens; the portal enforces its own 30 min idle / 12 h absolute limits.
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Only Aleida creates client accounts. Nobody can sign themselves up.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 30
token_verifications = 30

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
# One code per minute per address; codes expire after 10 minutes.
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Quail Hollow sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.external.apple]
enabled = false
